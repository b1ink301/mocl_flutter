name: mocl_flutter
description: "Mocl Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.6.1+406

environment:
  sdk: ">=3.13.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # localization
  # intl: ^0.20.2

  # icons
  # 2.x 는 chewie 가 아직 받지 않는다
  cupertino_icons: ^1.0.9

  # 앱과 서버(server/)가 함께 쓰는 엔티티 · 파서 · 로거 (순수 Dart)
  mocl_shared:
    path: packages/mocl_shared

  # HTML 파서
  html: ^0.15.7

  # 레거시 EUC-KR/CP949 사이트(뽐뿌·보배드림·82쿡) 디코딩용 (순수 Dart)
  cp949_codec: ^1.0.2

  # HTML Widget
  flutter_widget_from_html: ^0.17.4

  # Value equality
  equatable: ^3.0.0

  # Functional programming thingies
  fpdart: ^1.2.0

  # Remote API
  #  internet_connection_checker_plus: ^2.4.2
  # Http Client
  dio: ^5.11.1
  http: ^1.6.0

  # cookie
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0

  # Local cache
  shared_preferences: ^2.5.6

  # json
  json_annotation: ^4.12.0

  # Path
  path_provider: ^2.1.6
  path: ^1.9.1

  # Google Sign In & Drive
  google_sign_in: ^7.2.0
  # iOS SPM 에서 GoogleSignIn 10(firebase-ios-sdk 13 과 호환)을 받는 첫 버전
  google_sign_in_ios: ^6.4.0
  googleapis: ^18.0.0
  googleapis_auth: ^2.3.7

  # class 자동화
  freezed_annotation: ^3.1.0

  # 이미지 캐시
  cached_network_image: ^4.0.6
  # image: ^4.2.0
  flutter_cache_manager: ^3.5.0

  # URL 런처
  url_launcher: ^6.3.3

  # splash
#  flutter_native_splash: ^2.4.8
  #  gif: ^2.3.0
  # like room database
  #  floor: ^1.5.0
  #  hive_flutter: ^1.1.0

  # router
  go_router: ^18.1.4

  # firebase
  # 5.x(firebase-ios-sdk 13) 는 google_sign_in_ios 6.4.0+(GoogleSignIn 10)와 함께 써야
  # SPM 에서 gtm-session-fetcher 범위가 맞는다.
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  # 키워드 알림 푸시(서버 server/ 가 FCM HTTP v1 로 보낸다)
  firebase_messaging: ^17.0.1

  # async
  async: ^2.13.1

  # infinite pagination
  #  easy_infinite_pagination: ^0.0.6
  #  flutter_isolate: ^2.0.4

  # share
  share_plus: ^13.3.1
  #  share_plus_platform_interface: ^5.0.2

  # package info
  package_info_plus: ^10.2.2

  # time format
  timeago: ^3.7.1

  # like crashlytics..
  #  sentry_flutter: ^8.14.2

  # toast
  fluttertoast: ^10.0.2

  # webview
  flutter_inappwebview: ^6.2.0-beta.3

  # video (본문 <video> 는 fwfh_chewie 가 이미 끌어온다. 링크 재생 화면에서 직접 쓴다)
  chewie: ^1.17.4
  video_player: ^2.14.1

  # photo view
  photo_view: ^0.15.0

  # riverpod
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8
  hooks_riverpod: ^3.5.0

  flutter_hooks: ^0.21.4
  # sliver list
  #  super_sliver_list: ^0.4.1

  octo_image: ^2.1.4

  #  drift: ^2.23.1
  #  objectbox: ^4.0.3
  #  objectbox_generator: ^4.0.3

  #  rearch: ^1.16.0

  # nosql
  sembast: ^3.10.1
  sembast_web: ^2.4.7

#  cupertino_sidebar: ^1.0.1

  infinite_scroll_pagination: ^5.1.1
#  translator: ^1.0.4+1
  file_picker: ^13.3.2

  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  intl: any
  google_mobile_ads: ^9.2.0
  in_app_update: ^5.0.0
  upgrader: ^13.8.0
  marionette_flutter: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
#  integration_test:
#    sdk: flutter

  flutter_lints: ^6.0.0
  # 2.17(build 5)은 mockito 5.x 가 아직 받지 않는다
  build_runner: ^2.16.2
#  custom_lint:
  json_serializable: ^6.15.2
  mockito: ^5.8.1
  freezed: ^4.0.3
  analyzer: ^14.7.0
#  test: ^1.25.10
#  test_api: ^0.7.4
  riverpod_generator: ^4.0.10
  riverpod_lint: ^3.2.0

  # 사이트 로고 생성(tool/fetch_site_icons.dart) — ico/gif 디코딩 + 리사이즈
  image: ^4.12.0

  # 앱 아이콘 / 스플래시 생성
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # flavor
#  flutter_flavorizr: ^2.4.1

flutter:
  # iOS · macOS 플러그인은 CocoaPods 대신 Swift Package Manager 로 받는다.
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/icons/
    - assets/arcalive/
    - assets/bobaedream/
    - assets/damoang/
    - assets/clien/
    - assets/cook82/
    - assets/dcinside/
    - assets/dogdrip/
    - assets/geeknews/
    - assets/instiz/
    - assets/inven/
    - assets/meeco/
    - assets/mlbpark/
    - assets/nate/
    - assets/ppomppu/
    - assets/ruliweb/
    - assets/theqoo/

  # 앱 기본 폰트 (Pretendard v1.3.9 Variable, SIL OFL 1.1 — fonts/pretendard/OFL.txt)
  # 시스템 CJK 폴백 탐색을 없애고 기기 간 렌더링을 통일한다.
  # 가변 폰트 한 벌로 모든 굵기를 낸다(FontWeight 가 wght 축을 정한다).
  # 굵기별 정적 OTF 6개(약 9.1 MB)보다 작다(약 6.4 MB, 압축 시 약 2.9 MB).
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/pretendard/PretendardVariable.ttf


#fvm flutter pub upgrade --major-versions     # 메이저 업그레이드