# 오라클 서버에서:  cd server && docker compose up -d --build
# 도메인은 server/.env 의 MOCL_DOMAIN (.env.example 참고)

name: mocl

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # 설정 파일은 디렉터리째 붙인다. 파일 하나만 붙이면 편집기가 새 파일로
    # 바꿔 쓸 때 컨테이너가 옛 파일을 계속 본다. 서버는 수정 시각을 보고 다시 읽는다.
    volumes:
      - ./config:/app/config:ro
      # FCM 서비스 계정 JSON(firebase-service-account.json). 없으면 dry-run 으로 돈다.
      - ./secrets:/app/secrets:ro
      # 알림 구독 · 크롤 상태(sembast)
      - mocl_data:/app/data
    environment:
      FIREBASE_SERVICE_ACCOUNT: /app/secrets/firebase-service-account.json
    logging: &bounded-logs
      # 로그가 끝없이 쌓이지 않게 용량으로 순환한다(오래된 것부터 지워짐).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *bounded-logs
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MOCL_DOMAIN: ${MOCL_DOMAIN:?server/.env 에 MOCL_DOMAIN 을 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mocl_data:
  caddy_data:
  caddy_config:
