# 오라클 서버에서:  cd server && docker compose up -d --build
# 도메인은 server/.env 의 MOCL_DOMAIN (.env.example 참고)

name: mocl

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # 설정 파일은 디렉터리째 붙인다. 파일 하나만 붙이면 편집기가 새 파일로
    # 바꿔 쓸 때 컨테이너가 옛 파일을 계속 본다. 서버는 수정 시각을 보고 다시 읽는다.
    volumes:
      - ./config:/app/config:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MOCL_DOMAIN: ${MOCL_DOMAIN:?server/.env 에 MOCL_DOMAIN 을 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
