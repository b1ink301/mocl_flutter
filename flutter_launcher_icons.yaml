flutter_launcher_icons:
  android: true
  ios: true
  # 레거시(구형 안드로이드) + iOS 용 전체 아이콘 (오렌지 배경 + 흰 m)
  image_path: "branding/app_icon.png"
  # Android 8+ 적응형 아이콘
  adaptive_icon_background: "#EA5E39"
  adaptive_icon_foreground: "branding/icon_foreground.png"
  # Android 13+ 모노크롬(테마) 아이콘
  adaptive_icon_monochrome: "branding/icon_monochrome.png"
  min_sdk_android: 21
  remove_alpha_ios: true
