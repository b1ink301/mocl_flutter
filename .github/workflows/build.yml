name: Build

# analyze · test(ci.yml)는 통과해도 네이티브 빌드에서만 드러나는 문제를 잡는다.
#  - iOS: Swift Package Manager 패키지 해석 실패(예: firebase_core 5.x ↔ google_sign_in_ios)
#  - Android: R8 이 JNI 로만 쓰이는 클래스를 지우거나 줄이는 문제(빌드는 통과하고 앱만 멈춘다)
# macOS 는 CI 러너에서 서명 · 빌드가 안정적이지 않아 로컬에서만 빌드한다.
on:
  push:
    branches: [develop, main]
    paths-ignore: &docs
      - '**.md'
      - 'store/**'
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Debug 로 빌드한다 — Release 는 Crashlytics 심볼 업로드 단계가 flutterfire CLI 를 찾는다.
      - name: Build iOS
        run: flutter build ios --debug --no-codesign --flavor dev

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 빌드 타입마다 업로드 키로 서명하므로 key.properties 가 있어야 한다.
      # 포크 PR 처럼 Secrets 를 받지 못하면 건너뛴다.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MAPPING: build/app/outputs/mapping/devRelease/mapping.txt
    steps:
      - name: Skip without signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::notice::서명 Secrets 가 없어 Android 빌드를 건너뜁니다"

      - name: Checkout code
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21' # build.gradle.kts 의 JVM_21 과 맞춘다
          cache: gradle

      - name: Read Flutter version
        if: env.KEYSTORE_BASE64 != ''
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: env.KEYSTORE_BASE64 != ''
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        if: env.KEYSTORE_BASE64 != ''
        run: flutter pub get --enforce-lockfile

      # release.yml 과 같은 방식 — env 로 넘겨 특수문자에 깨지지 않게 한다.
      - name: Create keystore and key.properties
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
          } > android/key.properties

      # ads.json 없이 빌드하면 Google 테스트 광고 ID 로 들어간다(CI 확인용이라 충분).
      - name: Build Android (dev release)
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build apk --release --flavor dev

      - name: Check R8 keep rules
        if: env.KEYSTORE_BASE64 != ''
        run: dart run tool/check_jni_keep.dart "$MAPPING"
