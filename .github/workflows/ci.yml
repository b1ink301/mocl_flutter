name: CI

# 로컬 pre-commit 훅과 같은 검사를 push · PR 마다 돌린다.
# 훅이 없는 환경이나 훅을 건너뛴 커밋도 여기서 걸러진다.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 로컬과 같은 버전(.fvmrc)으로 고정한다
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # pubspec.lock 과 다른 버전을 받지 않는다(lock 갱신은 로컬에서 스모크 테스트와 함께).
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # analysis_options 의 legacy 플러그인(custom_lint) 경고 하나는 알려진 것이라 빼고,
      # 그 밖의 이슈는 info 까지 하나라도 있으면 실패시킨다.
      - name: Analyze
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          grep -v '|ANALYSIS_OPTIONS_DEPRECATED_PLUGINS|' analyze.txt | grep -E '^(ERROR|WARNING|INFO)\|' > issues.txt || true
          if [ -s issues.txt ]; then
            cat issues.txt
            echo "::error::dart analyze 이슈 $(wc -l < issues.txt)건"
            exit 1
          fi

      - name: Check provider imports
        run: dart run tool/check_provider_imports.dart

      - name: Check logging
        run: dart run tool/check_logging.dart

      - name: Test
        run: flutter test
