name: Build and Release Flutter Android

on:
  push:
    tags:
      - 'v*.*.*' # v1.0.0과 같은 태그가 푸시될 때 실행
#  pull_request:
#    types: [ closed ] # PR이 닫혔을 때 워크플로우 실행
#    branches:
#      - main # main 브랜치에 대한 PR만 해당

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 생성, 수정 등 콘텐츠 쓰기 권한 부여

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 자바(JDK) 설치
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # build.gradle.kts 의 JVM_21 과 맞춘다(17 이면 컴파일 실패)

      # 3. Flutter SDK 설치 — 로컬과 같은 버전(.fvmrc)으로 고정한다
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # 4. 의존성 설치
      - name: Install dependencies
        run: flutter pub get

      # 5. Keystore 디코딩 (Secrets 사용)
      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 6. key.properties 파일 생성 (Secrets 사용)
      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
      
      # 6-1. AdMob 실제 ID (Secrets 의 ADS_JSON = ads.example.json 형식)
      #      스크립트에 직접 보간하지 않고 env 로 넘긴다(따옴표가 섞이면 깨진다).
      #      비어 있으면 테스트 ID 로 조용히 배포되므로 여기서 멈춘다.
      - name: Create ads.json
        env:
          ADS_JSON: ${{ secrets.ADS_JSON }}
        run: |
          [ -n "$ADS_JSON" ] || { echo "::error::Secrets ADS_JSON 이 비어 있습니다"; exit 1; }
          printf '%s' "$ADS_JSON" > ads.json

      # 7. Flutter 릴리즈 빌드
      - name: Build Release
        run: flutter build apk --flavor prd --dart-define-from-file=ads.json

      # 8. GitHub Release 생성 및 파일 업로드
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          # 워크플로우를 실행시킨 Git 태그를 릴리즈 태그로 사용
          tag: ${{ github.ref_name }}
          # 릴리즈 이름
          name: Release ${{ github.ref_name }}
          # 릴리즈 노트 (비워두면 태그의 커밋 메시지가 자동으로 사용됨)
          body: ""
          # 드래프트(초안) 상태로 생성할지 여부
          draft: false
          # Prerelease로 표시할지 여부
          prerelease: false
          # 업로드할 파일들 (줄바꿈으로 여러 개 지정 가능)
          artifacts: |
            build/app/outputs/flutter-apk/app-prd-release.apk
          # GitHub API 인증 토큰
          token: ${{ secrets.GITHUB_TOKEN }}